<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Date-Wise Fee Collection & Search</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; margin: 0; padding: 15px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); max-width: 1200px; margin: 0 auto; }
    h2 { margin-top: 0; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    
    .filter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 13px; font-weight: 600; color: #475569; margin-bottom: 5px; }
    .form-group input, .form-group select { padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; outline: none; }
    
    .btn-search { background-color: #0284c7; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; height: 38px; align-self: flex-end; }
    .btn-search:hover { background-color: #0369a1; }

    .summary-boxes { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .box { background: #f8fafc; border: 1px solid #e2e8f0; border-left: 4px solid #0284c7; padding: 12px; border-radius: 6px; }
    .box span { font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; }
    .box h3 { margin: 5px 0 0 0; color: #0f172a; font-size: 18px; }

    .table-responsive { overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; background: #fff; font-size: 13px; text-align: left; }
    th { background: #f1f5f9; color: #334155; padding: 10px; font-weight: 700; border-bottom: 2px solid #cbd5e1; white-space: nowrap; }
    td { padding: 10px; border-bottom: 1px solid #e2e8f0; color: #334155; white-space: nowrap; }
    tr:hover { background-color: #f8fafc; }

    .badge-date { background-color: #e0f2fe; color: #0369a1; padding: 3px 8px; border-radius: 4px; font-weight: 600; }
    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .no-data { text-align: center; padding: 20px; color: #94a3b8; font-style: italic; }
  </style>
</head>
<body>

<div class="card">
  <h2>Date-Wise Collection & Search Portal</h2>

  <!-- Filter Section -->
  <div class="filter-grid">
    <div class="form-group">
      <label for="searchId">Student ID / Reg No (Leave blank for ALL)</label>
      <input type="text" id="searchId" placeholder="e.g. 101 or leave blank for All">
    </div>
    <div class="form-group">
      <label for="fromDate">From Paid Date</label>
      <input type="date" id="fromDate">
    </div>
    <div class="form-group">
      <label for="toDate">To Paid Date</label>
      <input type="date" id="toDate">
    </div>
    <div class="form-group">
      <button class="btn-search" onclick="fetchCollectionData()">Search Report</button>
    </div>
  </div>

  <!-- Summary Cards -->
  <div class="summary-boxes">
    <div class="box">
      <span>Total Receipts</span>
      <h3 id="totalCount">0</h3>
    </div>
    <div class="box" style="border-left-color: #16a34a;">
      <span>Total Paid Balance</span>
      <h3 id="totalPaid">₹0</h3>
    </div>
    <div class="box" style="border-left-color: #eab308;">
      <span>Total Discount</span>
      <h3 id="totalDiscount">₹0</h3>
    </div>
    <div class="box" style="border-left-color: #dc2626;">
      <span>Total Remaining Due</span>
      <h3 id="totalDue">₹0</h3>
    </div>
  </div>

  <!-- Results Table -->
  <div class="table-responsive">
    <table>
      <thead>
        <tr>
          <th>Paid Date</th>
          <th>Receipt No</th>
          <th>Student Name</th>
          <th>Class</th>
          <th>Fee Month</th>
          <th class="text-right">Sub Total</th>
          <th class="text-right">Discount</th>
          <th class="text-right">Paid Balance</th>
          <th class="text-right">Due</th>
        </tr>
      </thead>
      <tbody id="collectionTableBody">
        <tr>
          <td colspan="9" class="no-data">Select date range and click Search.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  // YOUR APPS SCRIPT WEB APP URL HERE
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzaXTgDU-2zWJwbsDRBGz-2-_R3CHwTMKAltNhweLV3ai6wb84XauVaqKRf0Jp1paWP4g/exec"; 

  // Auto-set current date in filters
  window.onload = function() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('fromDate').value = today;
    document.getElementById('toDate').value = today;
  };

  function fetchCollectionData() {
    const studentId = document.getElementById('searchId').value.trim() || 'all';
    const fromDate = document.getElementById('fromDate').value;
    const toDate = document.getElementById('toDate').value;

    const tbody = document.getElementById('collectionTableBody');
    tbody.innerHTML = '<tr><td colspan="9" class="text-center">Loading collection data...</td></tr>';

    // Form JSONP request for GitHub Pages CORS Bypass
    const callbackName = 'handleCollectionResponse_' + Math.floor(Math.random() * 100000);
    
    let url = `${SCRIPT_URL}?action=searchData&id=${encodeURIComponent(studentId)}&fromDate=${fromDate}&toDate=${toDate}&callback=${callbackName}`;

    window[callbackName] = function(data) {
      renderTableData(data);
      delete window[callbackName];
      document.body.removeChild(script);
    };

    const script = document.createElement('script');
    script.src = url;
    document.body.appendChild(script);
  }

  function renderTableData(records) {
    const tbody = document.getElementById('collectionTableBody');
    tbody.innerHTML = '';

    if (!records || records.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" class="no-data">Is date range me koi entry nahi mili.</td></tr>';
      resetSummaries();
      return;
    }

    let grandPaid = 0;
    let grandDiscount = 0;
    let grandDue = 0;
    let totalCount = 0;

    records.forEach(row => {
      // Helper function for case-insensitive column keys
      const getVal = (keys) => {
        for (let k of keys) {
          for (let prop in row) {
            if (prop.toLowerCase().trim() === k.toLowerCase().trim() && row[prop] !== undefined) {
              return row[prop];
            }
          }
        }
        return '';
      };

      const paidDate = getVal(["Paid Date", "PaidDate", "Date"]) || 'N/A';
      const receiptNo = getVal(["Receipt No", "ReceiptNo", "Receipt"]) || '-';
      const studentName = getVal(["Student Name", "Students' Name", "Name"]) || '-';
      const sClass = getVal(["Class"]) || '-';
      const month = getVal(["Month"]) || '-';
      
      const subTotal = parseFloat(getVal(["Sub Total", "SubTotal", "Total"])) || 0;
      const discount = parseFloat(getVal(["Discount"])) || 0;
      const paidBalance = parseFloat(getVal(["Paid Balance", "Paid", "Paid Amount", "Amount Paid"])) || 0;
      const due = parseFloat(getVal(["Due", "Remaining", "Remaining Fee", "Prev Dues"])) || 0;

      grandPaid += paidBalance;
      grandDiscount += discount;
      grandDue += due;
      totalCount++;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="badge-date">${paidDate}</span></td>
        <td><strong>${receiptNo}</strong></td>
        <td>${studentName}</td>
        <td>${sClass}</td>
        <td>${month}</td>
        <td class="text-right">₹${subTotal.toFixed(2)}</td>
        <td class="text-right">₹${discount.toFixed(2)}</td>
        <td class="text-right" style="color: #16a34a; font-weight: bold;">₹${paidBalance.toFixed(2)}</td>
        <td class="text-right" style="color: #dc2626; font-weight: bold;">₹${due.toFixed(2)}</td>
      `;
      tbody.appendChild(tr);
    });

    // Update Summary Boxes
    document.getElementById('totalCount').innerText = totalCount;
    document.getElementById('totalPaid').innerText = '₹' + grandPaid.toLocaleString('en-IN');
    document.getElementById('totalDiscount').innerText = '₹' + grandDiscount.toLocaleString('en-IN');
    document.getElementById('totalDue').innerText = '₹' + grandDue.toLocaleString('en-IN');
  }

  function resetSummaries() {
    document.getElementById('totalCount').innerText = '0';
    document.getElementById('totalPaid').innerText = '₹0';
    document.getElementById('totalDiscount').innerText = '₹0';
    document.getElementById('totalDue').innerText = '₹0';
  }
</script>

</body>
</html>
