<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .card h3 { margin: 0; color: #666; font-size: 14px; }
        .card p { margin: 10px 0 0; font-size: 24px; font-weight: bold; color: #2c3e50; }
        
        .controls { background: white; padding: 15px; border-radius: 10px; display: flex; gap: 10px; margin-bottom: 20px; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; flex: 1; }
        
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
        th { background: #3498db; color: white; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        
        .btn-wa { background: #25D366; color: white; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-weight: bold; display: inline-block; }
        .btn-wa:hover { background: #128C7E; }
    </style>
</head>
<body>

<h2>🏫 Barsoi Public School - Management</h2>

<!-- Dashboard Metrics -->
<div class="dashboard-grid">
    <div class="card"><h3>Total Students</h3><p id="stat-count">0</p></div>
    <div class="card"><h3>Total Due</h3><p id="stat-due">₹0</p></div>
</div>

<div class="controls">
    <select id="classFilter" onchange="updateView()">
        <option value="ALL">All Classes</option>
        <option value="Nursery">Nursery</option>
        <option value="1">Class 1</option>
    </select>
    <input type="text" id="searchBox" placeholder="Search student name..." onkeyup="updateView()">
</div>

<table id="studentTable">
    <thead>
        <tr><th>Name</th><th>Class</th><th>Due Amount</th><th>Action</th></tr>
    </thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
    let reminderRawData = [];
    
    // Load data on startup
    window.onload = function() {
    // Apne Google Apps Script Web App ka URL yahan paste karein
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyeBytEuHQQjspTk_ZKUiqF5wPupUNDoDgDCxnlM5AmImzu9xPSam-p0v_TTYq1jHit/exec";

    fetch(`${SCRIPT_URL}?action=getReminderData`)
    .then(res => res.json())
    .then(data => { 
        reminderRawData = data; 
        updateView(); 
    })
    .catch(err => console.error("Data Fetch Error:", err));
};

    function updateView() {
        const cFilter = document.getElementById('classFilter').value;
        const search = document.getElementById('searchBox').value.toLowerCase();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = "";
        
        let totalDue = 0;
        let count = 0;

        for(let i=1; i<reminderRawData.length; i++) {
            let r = reminderRawData[i];
            // Mapping: 0:Class, 1:Roll, 2:Name, 3:Father, 4:Addr, 5:Monthly, 6:Mobile, 7:PrevDue, 8:TotalDue
            if ((cFilter === "ALL" || r[0] == cFilter) && r[2].toLowerCase().includes(search)) {
                count++;
                totalDue += parseFloat(r[8] || 0);
                
                let waUrl = `https://wa.me/91${r[6]}?text=Hello ${r[2]}, your due is ₹${r[8]}`;
                
                tbody.innerHTML += `<tr>
                    <td><b>${r[2]}</b><br><small>${r[3]}</small></td>
                    <td>${r[0]}</td>
                    <td><b>₹${r[8]}</b></td>
                    <td><a href="${waUrl}" target="_blank" class="btn-wa">WhatsApp</a></td>
                </tr>`;
            }
        }
        document.getElementById('stat-count').innerText = count;
        document.getElementById('stat-due').innerText = "₹" + totalDue;
    }
</script>
</body>
</html>
