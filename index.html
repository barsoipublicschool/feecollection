<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barsoi Public School | Pro Dashboard</title>
    <!-- Tailwind CSS for Advanced UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loader { border-top-color: #2563eb; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-blue-700 text-white p-4 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-tight">🏫 Barsoi Public School</h1>
            <span id="date-time" class="text-xs opacity-80">Dashboard v2.0</span>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 md:p-6">
        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">Total Students</h3>
                <p id="stat-count" class="text-3xl font-bold text-gray-900 mt-2">--</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">Outstanding Dues</h3>
                <p id="stat-due" class="text-3xl font-bold text-red-600 mt-2">₹0</p>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="text-gray-500 text-sm font-medium">Status</h3>
                <p class="text-sm text-green-600 font-semibold mt-4 bg-green-50 px-3 py-1 rounded-full inline-block">System Active</p>
            </div>
        </div>

        <!-- Controls -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex flex-wrap gap-4 mb-6">
            <select id="classFilter" onchange="updateView()" class="bg-gray-50 border border-gray-300 rounded-lg p-2.5 w-full md:w-64 focus:ring-blue-500">
                <option value="ALL">All Classes</option>
                <option value="Nursery">Nursery</option>
                <option value="1">Class 1</option>
                <option value="5">Class 5</option>
                <option value="10">Class 10</option>
            </select>
            <input type="text" id="searchBox" onkeyup="updateView()" placeholder="Search Student..." class="bg-gray-50 border border-gray-300 rounded-lg p-2.5 flex-1">
        </div>

        <!-- Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left">
                <thead class="bg-gray-50 text-gray-600 text-xs uppercase font-semibold">
                    <tr>
                        <th class="px-6 py-4">Student</th>
                        <th class="px-6 py-4">Class</th>
                        <th class="px-6 py-4">Dues</th>
                        <th class="px-6 py-4">Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-100">
                    <!-- Loading State -->
                    <tr><td colspan="4" class="text-center py-10"><div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-10 w-10 mx-auto"></div></td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyeBytEuHQQjspTk_ZKUiqF5wPupUNDoDgDCxnlM5AmImzu9xPSam-p0v_TTYq1jHit/exec";
        let reminderRawData = [];

        window.onload = () => {
            fetch(`${SCRIPT_URL}?action=getReminderData`)
            .then(res => res.json())
            .then(data => { reminderRawData = data; updateView(); });
        };

        function updateView() {
            const tbody = document.getElementById('tableBody');
            const cFilter = document.getElementById('classFilter').value;
            const search = document.getElementById('searchBox').value.toLowerCase();
            
            let html = "";
            let count = 0;
            let totalDue = 0;

            for (let i = 1; i < reminderRawData.length; i++) {
                let r = reminderRawData[i];
                let sClass = (r[0] || "").toString().trim();
                let name = r[2] || "";
                let totalDueVal = parseFloat(r[8]) || 0;
                let phone = (r[6] || "").toString().replace(/[^0-9]/g, '');

                if ((cFilter === "ALL" || sClass === cFilter) && name.toLowerCase().includes(search)) {
                    count++;
                    totalDue += totalDueVal;

                    html += `
                    <tr class="hover:bg-blue-50 transition-colors">
                        <td class="px-6 py-4">
                            <div class="font-bold text-gray-900">${name}</div>
                            <div class="text-xs text-gray-500">Father: ${r[3]}</div>
                        </td>
                        <td class="px-6 py-4 font-medium text-blue-600">${sClass}</td>
                        <td class="px-6 py-4">
                            <span class="${totalDueVal > 0 ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'} px-2 py-1 rounded-lg text-sm font-bold">
                                ₹${totalDueVal}
                            </span>
                        </td>
                        <td class="px-6 py-4">
                            <a href="https://wa.me/91${phone}?text=Hello ${name}, your fee due is ₹${totalDueVal}" target="_blank" 
                               class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-md transition-all">
                                Send WhatsApp
                            </a>
                        </td>
                    </tr>`;
                }
            }
            document.getElementById('stat-count').innerText = count;
            document.getElementById('stat-due').innerText = "₹" + totalDue;
            tbody.innerHTML = html || '<tr><td colspan="4" class="text-center py-10 text-gray-400">No students found</td></tr>';
        }
    </script>
</body>
</html>
