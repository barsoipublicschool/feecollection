<!DOCTYPE html>
<html lang="hi">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Barsoi Public School Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --p: #1a237e; --bg: #f4f7f6; }
        * { box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
        
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-card h2 { color: var(--p); margin: 0 0 5px; font-size: 22px; font-weight: 700; }
        .login-card p { color: #666; font-size: 13px; margin-bottom: 25px; }
        
        .form-group { text-align: left; margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #333; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; font-family: inherit; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: var(--p); }
        
        .btn-login { width: 100%; background: var(--p); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn-login:hover { background: #0d1259; }
        .footer-text { margin-top: 20px; font-size: 11px; color: #888; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>BARSOI PUBLIC SCHOOL</h2>
    <p>NEHAR NAGAR, BLOCK ROAD, BARSOI (KATIHAR)</p>
    
    <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
            <label for="userRole">Select Role</label>
            <select id="userRole" required>
                <option value="admin">Administrator / Principal</option>
                <option value="operator">Counter Staff / Operator</option>
            </select>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter Username" required autocomplete="off">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter Password" required>
        </div>

        <button type="submit" class="btn-login">LOGIN NOW 🔐</button>
    </form>

    <div class="footer-text">
        Fees Management Portal &copy; 2026
    </div>
</div>

<script>
    function handleLogin(e) {
        e.preventDefault();

        const selectedRole = document.getElementById('userRole').value;
        const user = document.getElementById('username').value.trim().toLowerCase();
        const pass = document.getElementById('password').value;

        // 1. Admin Verification
        if (selectedRole === 'admin' && user === 'admin' && pass === 'admin123') {
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('userRole', 'admin');
            sessionStorage.setItem('userName', 'Administrator');
            
            Swal.fire({
                icon: 'success',
                title: 'Welcome Admin!',
                text: 'Logged in as Administrator',
                timer: 1200,
                showConfirmButton: false
            }).then(() => {
                window.location.href = 'dashboard.html';
            });
        } 
        // 2. Staff / Operator Verification
        else if (selectedRole === 'operator' && user === 'staff' && pass === 'staff123') {
            sessionStorage.setItem('isLoggedIn', 'true');
            sessionStorage.setItem('userRole', 'operator');
            sessionStorage.setItem('userName', 'Counter Staff');
            
            Swal.fire({
                icon: 'success',
                title: 'Welcome Staff!',
                text: 'Logged in as Counter Staff',
                timer: 1200,
                showConfirmButton: false
            }).then(() => {
                window.location.href = 'dashboard.html';
            });
        } 
        // 3. Incorrect Credentials
        else {
            Swal.fire('Login Failed', 'Wrong Username, Password or Selected Role!', 'error');
        }
    }
</script>

</body>
</html>
