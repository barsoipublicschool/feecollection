<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barsoi Public School - Fee Receipt</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; margin: 0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .receipt-box { width: 100%; max-width: 450px; background: #ffdae9; border: 1.5px solid #000; padding: 12px; color: #000; box-sizing: border-box; font-size: 10px; }
        .r-header { position: relative; text-align: center; }
        .r-header h2 { margin: 0; font-size: 16px; font-weight: 900; }
        .r-header p { margin: 1px; font-size: 8px; font-weight: bold; }
        .school-logo { width: 45px; height: 45px; position: absolute; left: 0px; top: 12px; }
        .top-info { display: flex; justify-content: space-between; font-size: 9.5px; margin-top: 5px; border-bottom: 1px solid #000; padding-bottom: 3px; }
        .copy-tag { background: #000; color: #fff; padding: 1px 6px; font-size: 8px; font-weight: bold; border-radius: 2px; }
        .student-details { display: grid; grid-template-columns: 1.2fr 0.8fr; font-size: 9.5px; margin-top: 5px; line-height: 1.3; }
        .r-table { width: 100%; border-collapse: collapse; margin-top: 5px; border: 1.2px solid #000; }
        .r-table th, .r-table td { border: 1px solid #000; padding: 3px; font-size: 9px; }
        .words-section { border-bottom: 1px dotted #000; padding: 4px 0; font-size: 9px; margin-top: 6px; font-style: italic; }
        .footer-sigs { display: flex; justify-content: space-between; margin-top: 25px; font-size: 9.5px; font-weight: bold; }
        .btn-print { margin-top: 15px; padding: 12px 25px; background: #2e7d32; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 14px; }
        @media print { .no-print { display: none !important; } body { padding: 0; background: none; } .receipt-box { width: 100%; max-width: 100%; } }
    </style>
</head>
<body>

<div id="loading" style="margin-top:50px; font-weight:bold;">Loading Receipt...</div>

<div class="receipt-box" id="receipt-content" style="display:none;"></div>

<button class="btn-print no-print" id="print-btn" style="display:none;" onclick="window.print()">📥 PRINT / SAVE PDF</button>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzfYp9PWNuL6gSRaAi48C20wV-4rxQ2C_e0Y3-OzElIDHRCbAZ1XiPMEcB04JsurcQ7/exec";

    function roman(n) { const r = ["i","ii","iii","iv","v","vi","vii","viii","ix","x"]; return r[n-1] || n; }

    function numberToWords(num) {
        var a = ['','One ','Two ','Three ','Four ', 'Five ','Six ','Seven ','Eight ','Nine ','Ten ','Eleven ','Twelve ','Thirteen ','Fourteen ','Fifteen ','Sixteen ','Seventeen ','Eighteen ','Nineteen '];
        var b = ['', '', 'Twenty','Thirty','Forty','Fifty', 'Sixty','Seventy','Eighty','Ninety'];
        if (num == 0) return 'Zero';
        var n = ('000000000' + num).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
        if (!n) return ''; var str = '';
        str += (n[1] != 0) ? (a[Number(n[1])] || b[n[1][0]] + ' ' + a[n[1][1]]) + 'Crore ' : '';
        str += (n[2] != 0) ? (a[Number(n[2])] || b[n[2][0]] + ' ' + a[n[2][1]]) + 'Lakh ' : '';
        str += (n[3] != 0) ? (a[Number(n[3])] || b[n[3][0]] + ' ' + a[n[3][1]]) + 'Thousand ' : '';
        str += (n[4] != 0) ? (a[Number(n[4])] || b[n[4][0]] + ' ' + a[n[4][1]]) + 'Hundred ' : '';
        str += (n[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n[5])] || b[n[5][0]] + ' ' + a[n[5][1]]) : '';
        return str.trim();
    }

    window.onload = async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const receiptNo = urlParams.get('receiptNo');
        const studentId = urlParams.get('id');

        if(!studentId && !receiptNo) {
            document.getElementById('loading').innerText = "Invalid Receipt Request";
            return;
        }

        try {
            const res = await fetch(`${SCRIPT_URL}?action=searchData&id=${studentId || 'all'}`);
            const dataList = await res.json();
            
            let match = null;
            if(Array.isArray(dataList)) {
                if(receiptNo) {
                    match = dataList.find(r => r["Receipt No"] === receiptNo);
                }
                if(!match && dataList.length > 0) match = dataList[dataList.length - 1];
            }

            if(match) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('receipt-content').innerHTML = buildReceipt(match);
                document.getElementById('receipt-content').style.display = 'block';
                document.getElementById('print-btn').style.display = 'block';
            } else {
                document.getElementById('loading').innerText = "Receipt Not Found";
            }
        } catch(e) {
            document.getElementById('loading').innerText = "Error loading receipt";
        }
    };

    function buildReceipt(d) {
        let sl = 1; let rows = "";
        const main = ["Prev Dues", "Admission Fee", "School Fee", "School Van Fee", "Hostel Fee", "Exam Fee"];
        main.forEach(k => { 
            let val = (d[k] !== undefined && d[k] !== null && d[k] !== "") ? d[k] : "";
            rows += `<tr><td align="center">${sl++}.</td><td>${k}</td><td align="center">1</td><td align="center">${val}</td></tr>`; 
        });

        const lists = {
            "School Uniform Fee": ["Shirts", "Pants", "T-Shirts", "ID Card", "Leggings", "Blazer", "Sweater", "Belt", "Tie", "Shoes", "Socks", "Logo"],
            "School Books & Other": ["Books Fee", "Copies", "Cover", "Geo-Box", "Diary", "Stationary"],
            "Miscellaneous Fees": ["Republic Day Fee", "Independence Day Fee", "UDISE Fee"]
        };

        for (let category in lists) {
            let tempRows = ""; let cSub = 1;
            lists[category].forEach(k => { 
                if(parseFloat(d[k]) > 0) {
                    tempRows += `<tr><td></td><td>(${roman(cSub++)}) ${k}</td><td align="center">1</td><td align="center">${d[k]}</td></tr>`; 
                }
            });
            if(tempRows) rows += `<tr><td align="center">${sl++}.</td><td colspan="3"><b>${category}</b></td></tr>` + tempRows;
        }

        ["School Bag", "Development Fee", "Other Fee"].forEach(k => { 
            let val = (d[k] !== undefined && d[k] !== null && d[k] !== "") ? d[k] : "";
            rows += `<tr><td align="center">${sl++}.</td><td>${k}</td><td align="center">1</td><td align="center">${val}</td></tr>`; 
        });

        let logo = "https://drive.google.com/thumbnail?id=14JG21SYtSpghaukrY6_QTB-LCYPZ8gkE&sz=w300";
        let displayDate = d["Paid Date"] || d["Entry Date"] || "";

        return `
            <div class="r-header">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
                    <span class="copy-tag">Student Copy</span>
                    <span style="font-weight:bold; font-size:10px; border:1px solid #000; padding:0 8px;">CASH MEMO</span>
                    <span style="font-size:7.5px;">Mob: 9279583673</span>
                </div>
                <img src="${logo}" class="school-logo">
                <h2>BARSOI PUBLIC SCHOOL</h2>
                <p>QUAZITOLA, BARSOI (KATIHAR)</p>
                <p style="font-size:7px">RTE Reg No. __ | UDISE No.10101119902</p>
            </div>
            <div class="top-info"><span>Receipt No: <b>${d["Receipt No"] || "________"}</b></span><span>Month: <b>${d["Month"]}</b></span><span>Date: ${displayDate}</span></div>
            <div class="student-details">
                <div><b>Name:</b> ${d["Student Name"]}</div><div><b>ID:</b> ${d["Student Id"]}</div>
                <div><b>Father:</b> ${d["Father Name"]}</div><div><b>Class:</b> ${d["Class"]}</div>
                <div><b>Address:</b> ${d["Address"]}</div><div><b>Mobile:</b> ${d["Mobile"] || d["Phone"] || ""}</div>
            </div>
            <table class="r-table">
                <thead><tr><th>Sl.</th><th>Description</th><th>Qty</th><th>Amount</th></tr></thead>
                <tbody>${rows}</tbody>
                <tfoot>
                    <tr><th colspan="3" align="right">Sub Total</th><td align="center">${d["Sub Total"]}</td></tr>
                    <tr><th colspan="3" align="right">Discount (-)</th><td align="center">${d["Discount"]}</td></tr>
                    <tr><th colspan="3" align="right">Net Paid</th><td align="center"><b>${d["Total Paid"]}</b></td></tr>
                    <tr><th colspan="3" align="right">Due Balance</th><td align="center" style="color:red"><b>${d["Remaining"]}</b></td></tr>
                </tfoot>
            </table>
            <div class="words-section"><b>Words:</b> ${numberToWords(d["Total Paid"])} Only.</div>
            <div class="footer-sigs"><span>Parent Signature</span><span>Authorized Signature</span></div>`;
    }
</script>
</body>
</html>
