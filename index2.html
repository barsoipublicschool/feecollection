<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARSOI PUBLIC SCHOOL - PARENT PORTAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #1e3c72; --secondary: #2a5298; --bg: #f4f7f6; --card: #ffffff; --text: #2c3e50; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding: 20px 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .portal-card { background: var(--card); width: 100%; max-width: 420px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .header-banner { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; text-align: center; padding: 22px 15px; }
        .header-banner h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
        .header-banner p { margin: 4px 0 0; font-size: 11px; opacity: 0.9; text-transform: uppercase; }
        .content-area { padding: 22px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #dcdfe6; border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none; transition: border-color 0.2s; }
        .form-group input:focus { border-color: var(--secondary); }
        .btn-submit { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        
        #dashboard-section { display: none; }
        .profile-card { background: #f8fafc; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 18px; border: 1px solid #e2e8f0; }
        .avatar-box { width: 55px; height: 55px; border-radius: 10px; background: #cbd5e1; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        .profile-info h4 { margin: 0 0 4px 0; font-size: 15px; color: var(--text); }
        .profile-info p { margin: 2px 0; font-size: 11px; color: #64748b; }
        .sec-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #edf2f7; padding-bottom: 6px; }
        .sec-title { font-size: 13px; font-weight: 600; color: var(--primary); }
        .logout-link { color: #ef4444; font-size: 12px; font-weight: 600; cursor: pointer; }
        .history-card { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid #e2e8f0; border-left: 4px solid var(--secondary); display: flex; justify-content: space-between; align-items: center; }
        .history-main h5 { margin: 0; font-size: 14px; color: var(--text); }
        .history-main p { margin: 3px 0 0 0; font-size: 10px; color: #64748b; }
        .paid-amount { font-size: 14px; font-weight: 700; color: #10b981; text-align: right; }
        .due-amount { font-size: 10px; font-weight: 600; color: #ef4444; text-align: right; margin-top: 2px; }
    </style>
</head>
<body>

<div class="portal-card">
    <div class="header-banner">
        <h2>BARSOI PUBLIC SCHOOL</h2>
        <p>Parent & Student Fee Portal</p>
    </div>

    <div class="content-area">
        <!-- LOGIN SECTION -->
        <div id="login-section">
            <div class="form-group">
                <label>Reg No / Student ID</label>
                <input type="text" id="sid" placeholder="e.g. 26">
            </div>
            <div class="form-group">
                <label>Registered Mobile No.</label>
                <input type="text" id="mobile" placeholder="e.g. 6207173992">
            </div>
            <button class="btn-submit" onclick="loginParent()">LOGIN & VIEW FEES</button>
        </div>

        <!-- DASHBOARD SECTION -->
        <div id="dashboard-section">
            <div class="profile-card" id="student-profile"></div>

            <div class="sec-header">
                <span class="sec-title">📊 Fee Payment History</span>
                <span class="logout-link" onclick="logout()"> Logout</span>
            </div>

            <div id="fee-history-container"></div>
        </div>
    </div>
</div>

<script>
    // Apka Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby99gppth0fRMxQGJrUoS0NuaTV0MQoqhDJ4PcO7Pv4-eWt3b8i6dSYO2CuyundA8t2/exec";

    function loginParent() {
        const idVal = document.getElementById('sid').value.trim();
        const mobVal = document.getElementById('mobile').value.trim();

        if (!idVal || !mobVal) {
            Swal.fire("Incomplete Info", "Reg No / Student ID aur Mobile Number dono bharna zaroori hai.", "warning");
            return;
        }

        Swal.fire({ title: 'Searching Record...', didOpen: () => Swal.showLoading(), allowOutsideClick: false });

        const callbackName = 'jsonp_cb_' + Math.round(100000 * Math.random());
        window[callbackName] = function(data) {
            delete window[callbackName];
            document.body.removeChild(script);
            Swal.close();

            if (data.status === "error") {
                Swal.fire("Record Not Found", data.message, "error");
            } else if (data.status === "success") {
                renderDashboard(data.student, data.fees);
            }
        };

        const script = document.createElement('script');
        script.src = `${SCRIPT_URL}?action=verifyLogin&id=${encodeURIComponent(idVal)}&mobile=${encodeURIComponent(mobVal)}&callback=${callbackName}`;
        script.onerror = function() {
            Swal.close();
            Swal.fire("Connection Error", "Server se connectivity ki samasya aayi hai.", "error");
        };
        document.body.appendChild(script);
    }

    function renderDashboard(student, fees) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dashboard-section').style.display = 'block';

        let imgTag = student["Photo url"] && student["Photo url"].includes('http') 
            ? `<img src="${student["Photo url"]}">` 
            : `<span style="font-size:24px; color:#64748b;">👤</span>`;

        document.getElementById('student-profile').innerHTML = `
            <div class="avatar-box">${imgTag}</div>
            <div class="profile-info">
                <h4>${student["Student Name"]}</h4>
                <p>Class: <b>${student["Class"]}</b> | Sec: <b>${student["Section"]}</b> | Reg No: <b>${student["Reg No"]}</b></p>
                <p>Father: <b>${student["Father Name"]}</b></p>
                <p>Mobile: <b>${student["Mobile No"]}</b></p>
            </div>
        `;

        let listHtml = "";
        if (!fees || fees.length === 0) {
            listHtml = `<p style="text-align:center; font-size:12px; color:#94a3b8; padding: 20px 0;">Koi fee record nahi mila.</p>`;
        } else {
            fees.forEach(item => {
                let paidVal = item["Total Paid"] || item["Paid"] || item["Amount Paid"] || 0;
                let dueVal = item["Remaining"] || item["Remaining Fee"] || item["Due"] || 0;
                let receiptVal = item["Receipt No"] || item["Receipt"] || "N/A";
                let dateVal = item["Paid Date"] || item["Date"] || "N/A";

                listHtml += `
                    <div class="history-card">
                        <div class="history-main">
                            <h5>${item.Month} <span style="font-size:10px; background:#f1f5f9; padding:2px 6px; border-radius:4px; font-weight:normal;">${dateVal}</span></h5>
                            <p>Receipt: #${receiptVal}</p>
                        </div>
                        <div>
                            <div class="paid-amount">₹${paidVal}</div>
                            <div class="due-amount">Due: ₹${dueVal}</div>
                        </div>
                    </div>
                `;
            });
        }

        document.getElementById('fee-history-container').innerHTML = listHtml;
    }

    function logout() {
        document.getElementById('dashboard-section').style.display = 'none';
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('sid').value = '';
        document.getElementById('mobile').value = '';
    }
</script>
</body>
</html>
