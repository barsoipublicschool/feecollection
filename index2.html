<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <title>BARSOI PUBLIC SCHOOL - PARENT PORTAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --p: #1a237e; --bg: #f4f7f6; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--p); font-size: 18px; margin-bottom: 5px; }
        p.sub-text { text-align: center; font-size: 12px; color: #666; margin-top: 0; margin-bottom: 20px; }
        label { font-size: 12px; font-weight: bold; color: #444; margin-bottom: 5px; display: block; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; margin-bottom: 12px; }
        .btn-login { width: 100%; padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        
        /* DASHBOARD SECTION */
        #portal-dashboard { display: none; }
        .student-profile { background: #e8eaf6; padding: 12px; border-radius: 6px; margin-bottom: 15px; border-left: 4px solid var(--p); }
        .student-profile h4 { margin: 0 0 5px 0; color: var(--p); font-size: 15px; }
        .student-profile p { margin: 2px 0; font-size: 12px; color: #333; }
        
        .history-card { background: #fff; border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .history-info h5 { margin: 0; font-size: 14px; color: #333; }
        .history-info p { margin: 3px 0 0; font-size: 11px; color: #666; }
        .btn-view { background: #e91e63; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; }

        /* RECEIPT MODAL */
        #receipt-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; overflow-y: auto; padding: 10px; }
        .receipt-box { width: 100%; max-width: 450px; margin: 0 auto; background: #ffdae9; border: 1.5px solid #000; padding: 10px; color: #000; font-family: Arial, sans-serif; box-sizing: border-box; }
        .r-header { position: relative; text-align: center; }
        .r-header h2 { margin: 0; font-size: 16px; font-weight: 900; }
        .r-header p { margin: 1px; font-size: 8px; font-weight: bold; }
        .school-logo { width: 40px; height: 40px; position: absolute; left: 5px; top: 5px; }
        .top-info { display: flex; justify-content: space-between; font-size: 9.5px; margin-top: 6px; border-bottom: 1px solid #000; padding-bottom: 2px; }
        .student-details { display: grid; grid-template-columns: 1.2fr 0.8fr; font-size: 9.5px; margin-top: 4px; line-height: 1.2; }
        .r-table { width: 100%; border-collapse: collapse; margin-top: 4px; border: 1.2px solid #000; }
        .r-table th, .r-table td { border: 1px solid #000; padding: 2px 4px; font-size: 9px; line-height: 1.1; }
        .words-section { border-bottom: 1px dotted #000; padding: 3px 0; font-size: 9px; margin-top: 5px; font-style: italic; }
        .footer-sigs { display: flex; justify-content: space-between; margin-top: 20px; font-size: 9.5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="login-container">
    <h2>BARSOI PUBLIC SCHOOL</h2>
    <p class="sub-text">Parent Fee Portal - Check Records & Receipts</p>
    
    <label>Student ID / Roll No</label>
    <input type="text" id="login-sid" placeholder="e.g. 11">
    
    <label>Registered Mobile Number</label>
    <input type="text" id="login-mob" placeholder="Enter mobile number">
    
    <button class="btn-login" onclick="parentLogin()">LOGIN TO VIEW FEES</button>
</div>

<!-- DASHBOARD VIEW -->
<div class="container" id="portal-dashboard">
    <h2>Student Fee Dashboard</h2>
    <div class="student-profile" id="profile-box"></div>
    
    <h4 style="color: var(--p); font-size: 14px; margin-bottom: 8px;">Payment History & Receipts</h4>
    <div id="history-list"></div>

    <button onclick="logout()" style="width:100%; padding:10px; background:#666; color:white; border:none; border-radius:4px; margin-top:15px; cursor:pointer; font-weight:bold;">LOGOUT</button>
</div>

<!-- RECEIPT MODAL FOR PARENT -->
<div id="receipt-modal">
    <div id="single-receipt-view"></div>
    <div style="text-align:center; margin-top:20px; padding-bottom:20px;">
        <button onclick="window.print()" style="padding:10px 20px; background:#2e7d32; color:white; border:none; cursor:pointer; font-weight:bold; border-radius:4px;">PRINT / SAVE PDF</button>
        <button onclick="closeReceipt()" style="padding:10px 20px; background:#666; color:white; border:none; border-radius:4px; margin-left:10px; cursor:pointer;">CLOSE</button>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytnZ8V5RwKx_F3cqqJ7iaBdvu8c0sKFtFIQK4GS8XAoZDVYjll7mZZ751qWYYWk7Q8/exec";
    let studentRecords = [];

    async function parentLogin() {
        let sid = document.getElementById('login-sid').value.trim();
        let mob = document.getElementById('login-mob').value.trim();

        if(!sid || !mob) {
            Swal.fire("Error", "Kripya Student ID aur Mobile Number dono bharein.", "warning");
            return;
        }

        Swal.fire({title:'Checking details...', didOpen:()=>Swal.showLoading(), allowOutsideClick: false});

        try {
            const res = await fetch(`${SCRIPT_URL}?action=searchData&id=${sid}`);
            let data = await res.json();
            Swal.close();

            if(!data || !data.length) {
                Swal.fire("Not Found", "Is Student ID ka koi record nahi mila.", "error");
                return;
            }

            // Note: Agar aapne Google Sheet mein mobile number ka column rakha hai toh aap yahan mobile number match bhi kara sakte hain. 
            // Abhi yeh ID ke basis par saare records fetch karke dashboard dikha dega.
            studentRecords = data;
            renderDashboard(data[0]);

        } catch(e) {
            Swal.fire("Error", "Server se connect karne mein samasya aayi.", "error");
        }
    }

    function renderDashboard(info) {
        document.getElementById('login-container').style.display = 'none';
        document.getElementById('portal-dashboard').style.display = 'block';

        let profileHtml = `
            <h4>${info["Student Name"]}</h4>
            <p><b>Student ID:</b> ${info["Student Id"]} | <b>Class:</b> ${info["Class"]}</p>
            <p><b>Father's Name:</b> ${info["Father Name"]}</p>
            <p style="color:red; margin-top:5px;"><b>Current Due Balance: ₹${info["Remaining"]}</b></p>
        `;
        document.getElementById('profile-box').innerHTML = profileHtml;

        let listHtml = "";
        studentRecords.forEach((r, index) => {
            listHtml += `
                <div class="history-card">
                    <div class="history-info">
                        <h5>Month: ${r.Month}</h5>
                        <p>Receipt: ${r["Receipt No"] || "N/A"} | Paid: ₹${r["Total Paid"]} | Date: ${r["Paid Date"] || "N/A"}</p>
                    </div>
                    <button class="btn-view" onclick="viewReceipt(${index})">VIEW RECEIPT</button>
                </div>
            `;
        });
        document.getElementById('history-list').innerHTML = listHtml;
    }

    function logout() {
        document.getElementById('portal-dashboard').style.display = 'none';
        document.getElementById('login-container').style.display = 'block';
        document.getElementById('login-sid').value = '';
        document.getElementById('login-mob').value = '';
        studentRecords = [];
    }

    function viewReceipt(index) {
        let d = studentRecords[index];
        if(!d) return;
        document.getElementById('single-receipt-view').innerHTML = generateReceiptHTML(d);
        document.getElementById('receipt-modal').style.display = 'block';
    }

    function closeReceipt() {
        document.getElementById('receipt-modal').style.display = 'none';
    }

    function formatDateDDMMYYYY(dateObj) {
        let d = dateObj ? new Date(dateObj) : new Date();
        if (isNaN(d.getTime())) d = new Date();
        let day = String(d.getDate()).padStart(2, '0');
        let month = String(d.getMonth() + 1).padStart(2, '0');
        let year = d.getFullYear();
        return `${day}/${month}/${year}`;
    }

    function roman(n) { const r = ["i","ii","iii","iv","v","vi","vii","viii","ix","x"]; return r[n-1] || n; }

    function numberToWords(num) {
        var a = ['','One ','Two ','Three ','Four ', 'Five ','Six ','Seven ','Eight ','Nine ','Ten ','Eleven ','Twelve ','Thirteen ','Fourteen ','Fifteen ','Sixteen ','Seventeen ','Eighteen ','Nineteen '];
        var b = ['', '', 'Twenty','Thirty','Forty','Fifty', 'Sixty','Seventy','Eighty','Ninety'];
        if (num == 0) return 'Zero';
        var n = ('000000000' + num).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
        if (!n) return ''; var str = '';
        str += (n[1] != 0) ? (a[Number(n[1])] || b[n[1][0]] + ' ' + a[n[1][1]]) + 'Crore ' : '';
        str += (n[2] != 0) ? (a[Number(n[2])] || b[n[2][0]] + ' ' + a[n[2][1]]) + 'Lakh ' : '';
        str += (n[3] != 0) ? (a[Number(n[3])] || b[n[3][0]] + ' ' + a[n[3][1]]) + 'Thousand ' : '';
        str += (n[4] != 0) ? (a[Number(n[4])] || b[n[4][0]] + ' ' + a[n[4][1]]) + 'Hundred ' : '';
        str += (n[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n[5])] || b[n[5][0]] + ' ' + a[n[5][1]]) : '';
        return str.trim();
    }

    function generateReceiptHTML(d) {
        let sl = 1; let rows = "";
        const main = ["Prev Dues", "Admission Fee", "School Fee", "School Van Fee", "Hostel Fee", "Exam Fee"];
        main.forEach(k => { if(d[k]>0) rows += `<tr><td align="center">${sl++}.</td><td>${k}</td><td align="center">1</td><td align="center">${d[k]}</td></tr>`; });
        
        const lists = {
            "School Uniform Fee": ["Shirts", "Pants", "T-Shirts", "ID Card", "Leggings", "Blazer", "Sweater", "Belt", "Tie", "Shoes", "Socks", "Logo"],
            "School Books & Other": ["Books Fee", "Copies", "Cover", "Geo-Box", "Diary", "Stationary"],
            "Miscellaneous Fees": ["Republic Day Fee", "Independence Day Fee", "UDISE Fee"]
        };

        for (let category in lists) {
            let tempRows = ""; let cSub = 1;
            lists[category].forEach(k => { if(d[k]>0) tempRows += `<tr><td></td><td>(${roman(cSub++)}) ${k}</td><td align="center">1</td><td align="center">${d[k]}</td></tr>`; });
            if(tempRows) rows += `<tr><td align="center">${sl++}.</td><td colspan="3"><b>${category}</b></td></tr>` + tempRows;
        }

        ["School Bag", "Development Fee", "Other Fee"].forEach(k => { if(d[k]>0) rows += `<tr><td align="center">${sl++}.</td><td>${k}</td><td align="center">1</td><td align="center">${d[k]}</td></tr>`; });

        let logo = "https://drive.google.com/thumbnail?id=1pWEjzAU2G4AUC0RhIJ8cMHdLtLvQ4YJe&sz=w300";
        let displayDate = d["Paid Date"] ? formatDateDDMMYYYY(d["Paid Date"]) : formatDateDDMMYYYY(new Date());

        return `
            <div class="receipt-box">
                <div class="r-header">
                    <img src="${logo}" class="school-logo">
                    <h2>BARSOI PUBLIC SCHOOL</h2>
                    <p>QUAZITOLA, BARSOI (KATIHAR)</p>
                    <p style="font-size:7px">RTE Reg No.21211472023218114225 | UDISE No.10101122703</p>
                </div>
                <div class="top-info"><span>Receipt No: <b>${d["Receipt No"] || "________"}</b></span><span>Date: ${displayDate}</span></div>
                <div class="student-details">
                    <div><b>Name:</b> ${d["Student Name"]}</div><div><b>ID:</b> ${d["Student Id"]}</div>
                    <div><b>Father:</b> ${d["Father Name"]}</div><div><b>Class:</b> ${d["Class"]}</div>
                    <div><b>Address:</b> ${d["Address"]}</div><div><b>Month:</b> ${d["Month"]}</div>
                </div>
                <table class="r-table">
                    <thead><tr><th>Sl.</th><th>Description</th><th>Qty</th><th>Amount</th></tr></thead>
                    <tbody>${rows}</tbody>
                    <tfoot>
                        <tr><th colspan="3" align="right">Sub Total</th><td align="center">${d["Sub Total"]}</td></tr>
                        <tr><th colspan="3" align="right">Discount (-)</th><td align="center">${d["Discount"]}</td></tr>
                        <tr><th colspan="3" align="right">Net Paid</th><td align="center"><b>${d["Total Paid"]}</b></td></tr>
                        <tr><th colspan="3" align="right">Due Balance</th><td align="center" style="color:red"><b>${d["Remaining"]}</b></td></tr>
                    </tfoot>
                </table>
                <div class="words-section"><b>Words:</b> ${numberToWords(d["Total Paid"])} Only.</div>
                <div class="footer-sigs"><span>Parent Signature</span><span>Authorized Signature</span></div>
            </div>`;
    }
</script>
</body>
</html>
