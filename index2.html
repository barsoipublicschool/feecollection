<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barsoi Public School - Fee Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800">

    <!-- Container -->
    <div class="max-w-md mx-auto min-h-screen bg-white shadow-xl flex flex-col justify-between">
        
        <!-- Header -->
        <div class="bg-indigo-600 text-white p-6 text-center rounded-b-3xl shadow-lg">
            <h1 class="text-2xl font-bold tracking-wide">BARSOI PUBLIC SCHOOL</h1>
            <p class="text-xs text-indigo-200 mt-1 uppercase tracking-widest">Student Fee & Login Portal</p>
        </div>

        <!-- Main Content Area -->
        <div class="p-6 flex-grow">
            
            <!-- Login Form Section -->
            <div id="loginSection" class="space-y-4">
                <div class="text-center mb-6">
                    <h2 class="text-xl font-semibold text-slate-700">Student Portal Login</h2>
                    <p class="text-sm text-slate-500 mt-1">Enter your ID / Roll No and Registered Mobile Number</p>
                </div>

                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Student ID / Roll No</label>
                        <input type="text" id="loginId" placeholder="e.g. 101 or REG123" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">Registered Mobile Number</label>
                        <input type="tel" id="loginMobile" placeholder="e.g. 9876543210" class="w-full px-4 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                    
                    <button onclick="handleLogin()" id="loginBtn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold hover:bg-indigo-700 transition duration-200 shadow-md mt-2 flex items-center justify-center space-x-2">
                        <span>Login</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </div>

                <div id="loginError" class="hidden mt-3 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-xl text-center"></div>
            </div>

            <!-- Student Dashboard Section (Hidden by default) -->
            <div id="dashboardSection" class="hidden space-y-6">
                <!-- Student Profile Card -->
                <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-4 flex items-center space-x-4">
                    <div id="studentAvatar" class="w-16 h-16 bg-indigo-200 rounded-full flex items-center justify-center text-indigo-700 font-bold text-xl overflow-hidden shadow-inner">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="flex-grow">
                        <h3 id="stdName" class="font-bold text-slate-800 text-lg">Student Name</h3>
                        <p class="text-xs text-slate-600">Class: <span id="stdClass" class="font-semibold"></span> | Roll: <span id="stdRoll" class="font-semibold"></span></p>
                        <p class="text-xs text-slate-500 mt-0.5">Father: <span id="stdFather"></span></p>
                    </div>
                </div>

                <!-- Fee Records Overview -->
                <div>
                    <h4 class="text-sm font-bold text-slate-700 mb-3 flex items-center justify-between">
                        <span>Fee Payment History</span>
                        <button onclick="logout()" class="text-xs text-red-500 hover:underline font-normal"><i class="fa-solid fa-power-off mr-1"></i>Logout</button>
                    </h4>
                    
                    <div id="feeRecordsList" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                        <!-- Dynamic records will be injected here -->
                    </div>
                </div>
            </div>

            <!-- Loading Spinner -->
            <div id="loadingSpinner" class="hidden flex flex-col items-center justify-center py-12 space-y-3">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
                <p class="text-xs text-slate-500">Please wait...</p>
            </div>

        </div>

        <!-- Footer -->
        <div class="p-4 text-center text-xs text-slate-400 border-t border-slate-100">
            &copy; Barsoi Public School. All rights reserved.
        </div>

    </div>

    <!-- Script Logic -->
    <script>
        // Web App URL dynamically set from Google Apps Script or fallback
        const WEB_URL = window.location.href.split('?')[0];

        function showLoading(show) {
            document.getElementById('loadingSpinner').classList.toggle('hidden', !show);
        }

        function showError(msg) {
            const errDiv = document.getElementById('loginError');
            errDiv.innerText = msg;
            errDiv.classList.remove('hidden');
        }

        function handleLogin() {
            const id = document.getElementById('loginId').value.trim();
            const mobile = document.getElementById('loginMobile').value.trim();

            if (!id || !mobile) {
                showError("Please enter both Student ID/Roll No and Mobile Number.");
                return;
            }

            document.getElementById('loginError').classList.add('hidden');
            showLoading(true);

            // Google Apps Script doGet request via JSONP / fetch
            const targetUrl = `${WEB_URL}?action=verifyLogin&id=${encodeURIComponent(id)}&mobile=${encodeURIComponent(mobile)}`;

            fetch(targetUrl)
                .then(response => response.json())
                .then(data => {
                    showLoading(false);
                    if (data.status === "success") {
                        renderDashboard(data.student, data.fees);
                    } else {
                        showError(data.message || "Login failed. Check your credentials.");
                    }
                })
                .catch(err => {
                    showLoading(false);
                    showError("Connection error. Please try again.");
                    console.error(err);
                });
        }

        function renderDashboard(student, fees) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');

            document.getElementById('stdName').innerText = student["Student Name"] || "N/A";
            document.getElementById('stdClass').innerText = student["Class"] || "N/A";
            document.getElementById('stdRoll').innerText = student["Roll No"] || student["Reg No"] || "N/A";
            document.getElementById('stdFather').innerText = student["Father Name"] || "N/A";

            if (student["Photo url"]) {
                document.getElementById('studentAvatar').innerHTML = `<img src="${student["Photo url"]}" class="w-full h-full object-cover">`;
            }

            const listContainer = document.getElementById('feeRecordsList');
            listContainer.innerHTML = "";

            if (!fees || fees.length === 0) {
                listContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">No fee records found.</p>`;
                return;
            }

            fees.forEach(fee => {
                const card = document.createElement('div');
                card.className = "bg-white border border-slate-200 rounded-xl p-3 shadow-sm flex items-center justify-between text-xs";
                
                card.innerHTML = `
                    <div>
                        <span class="font-bold text-indigo-600 block mb-0.5">${fee.Month || 'Month'}</span>
                        <span class="text-slate-500">Receipt: ${fee["Receipt No"] || 'N/A'}</span>
                    </div>
                    <div class="text-right">
                        <span class="font-semibold text-slate-700 block">₹${fee["Total Paid"] || fee["Paid Amount"] || fee["Amount"] || '0'}</span>
                        <span class="text-emerald-600 text-[10px] bg-emerald-50 px-2 py-0.5 rounded-full">Paid</span>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function logout() {
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('loginId').value = "";
            document.getElementById('loginMobile').value = "";
        }
    </script>
</body>
</html>
