<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barsoi Public School - Parent Portal</title>
    <!-- Tailwind CSS for Modern Responsive UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SweetAlert2 for clean alerts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4">

    <!-- Main Container -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-100">
        
        <!-- Header -->
        <div class="bg-indigo-700 text-white p-6 text-center relative">
            <div class="w-16 h-16 bg-white/10 rounded-full mx-auto flex items-center justify-center mb-2 backdrop-blur-sm">
                <i class="fa-solid fa-graduation-cap text-3xl text-indigo-200"></i>
            </div>
            <h1 class="text-xl font-bold tracking-wide">BARSOI PUBLIC SCHOOL</h1>
            <p class="text-xs text-indigo-200 mt-0.5 font-medium">Student Fee & Profile Portal</p>
        </div>

        <!-- Content Area -->
        <div class="p-6">
            
            <!-- LOGIN FORM -->
            <div id="loginForm" class="space-y-4">
                <div class="text-center mb-4">
                    <h2 class="text-lg font-semibold text-slate-700">Student Login</h2>
                    <p class="text-xs text-slate-400">Login with ID/Roll No & Registered Mobile</p>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Student ID / Roll No</label>
                    <div class="relative">
                        <i class="fa-solid fa-id-card absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                        <input type="text" id="loginId" placeholder="e.g. 7 or 26" class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm bg-slate-50">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Mobile Number</label>
                    <div class="relative">
                        <i class="fa-solid fa-phone absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
                        <input type="tel" id="loginMobile" placeholder="Registered 10-digit mobile" class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm bg-slate-50">
                    </div>
                </div>

                <button onclick="loginStudent()" id="loginBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-200 transition-all flex items-center justify-center space-x-2 text-sm mt-2">
                    <span>Login to Portal</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>

            <!-- STUDENT DASHBOARD (Hidden initially) -->
            <div id="dashboard" class="hidden space-y-5">
                
                <!-- Profile Card -->
                <div class="bg-gradient-to-r from-indigo-600 to-indigo-800 text-white p-4 rounded-2xl shadow-md flex items-center space-x-4">
                    <img id="studentPhoto" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="w-16 h-16 rounded-full border-2 border-white/50 object-cover bg-white">
                    <div class="overflow-hidden">
                        <h3 id="dashName" class="font-bold text-base truncate">Student Name</h3>
                        <p class="text-xs text-indigo-200 mt-0.5">Class: <span id="dashClass" class="font-semibold"></span> (<span id="dashSec"></span>)</p>
                        <p class="text-xs text-indigo-200">Roll No: <span id="dashRoll" class="font-semibold"></span></p>
                        <p class="text-[11px] text-indigo-300 truncate mt-0.5"><i class="fa-solid fa-user-group mr-1"></i><span id="dashFather"></span></p>
                    </div>
                </div>

                <!-- Fee Payment History Section -->
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <h4 class="text-xs font-bold text-slate-700 uppercase tracking-wider">Fee Payment History</h4>
                        <button onclick="logout()" class="text-xs text-red-500 font-semibold hover:underline flex items-center">
                            <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                        </button>
                    </div>

                    <div id="feeList" class="space-y-2.5 max-h-64 overflow-y-auto pr-1">
                        <!-- Fee Cards dynamically injected here -->
                    </div>
                </div>

            </div>

        </div>

        <!-- Footer -->
        <div class="bg-slate-50 p-3 text-center border-t border-slate-100 text-[11px] text-slate-400">
            Powered by Barsoi Public School Digital Systems
        </div>

    </div>

    <!-- JavaScript Section -->
    <script>
        // AAPKA GOOGLE APPS SCRIPT WEB APP URL
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyR0YO7tRy6GTgGv4IPU32F-nTJUIsgflMPdt31SeITmJ9RQefPsZlBMXpNYQTHA-NysQ/exec";

        async function loginStudent() {
            const id = document.getElementById('loginId').value.trim();
            const mobile = document.getElementById('loginMobile').value.trim();

            if (!id || !mobile) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Incomplete Details',
                    text: 'Kripya Student ID/Roll No aur Mobile Number dono darj karein.',
                    confirmColor: '#4f46e5'
                });
                return;
            }

            Swal.fire({
                title: 'Verifying Student...',
                text: 'Kripya thoda intezar karein',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                // Fetch Request with Redirect Mode Follow for Google Apps Script Web App
                const requestUrl = `${GOOGLE_SCRIPT_URL}?action=verifyLogin&id=${encodeURIComponent(id)}&mobile=${encodeURIComponent(mobile)}`;
                const response = await fetch(requestUrl, { redirect: "follow" });
                const data = await response.json();

                Swal.close();

                if (data.status === "success") {
                    renderPortal(data.student, data.fees);
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Failed',
                        text: data.message || 'Galaat ID ya Mobile Number.',
                        confirmColor: '#4f46e5'
                    });
                }
            } catch (error) {
                Swal.close();
                console.error("API Error:", error);
                Swal.fire({
                    icon: 'error',
                    title: 'Connection Error',
                    text: 'Server se connect nahi ho paya. Kripya Apps Script Deployment check karein.',
                    confirmColor: '#4f46e5'
                });
            }
        }

        function renderPortal(student, fees) {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');

            document.getElementById('dashName').innerText = student["Student Name"] || "N/A";
            document.getElementById('dashClass').innerText = student["Class"] || "-";
            document.getElementById('dashSec').innerText = student["Section"] || "-";
            document.getElementById('dashRoll').innerText = student["Roll No"] || student["Reg No"] || "N/A";
            document.getElementById('dashFather').innerText = student["Father Name"] || "N/A";

            if (student["Photo url"]) {
                document.getElementById('studentPhoto').src = student["Photo url"];
            }

            const feeListContainer = document.getElementById('feeList');
            feeListContainer.innerHTML = "";

            if (!fees || fees.length === 0) {
                feeListContainer.innerHTML = `
                    <div class="text-center py-6 bg-slate-50 rounded-xl border border-dashed border-slate-200">
                        <p class="text-xs text-slate-400">Koi fee record nahi mila.</p>
                    </div>`;
                return;
            }

            fees.forEach(record => {
                const month = record.Month || "N/A";
                const paid = record["Total Paid"] || record["Paid"] || 0;
                const due = record["Remaining"] || record["Due"] || 0;
                const receiptNo = record["Receipt No"] || record["Receipt Number"] || "N/A";

                const card = document.createElement('div');
                card.className = "bg-slate-50 border border-slate-200 p-3 rounded-xl flex items-center justify-between text-xs";
                card.innerHTML = `
                    <div>
                        <span class="font-bold text-slate-800 block text-sm">${month}</span>
                        <span class="text-[11px] text-slate-500">Receipt No: ${receiptNo}</span>
                    </div>
                    <div class="text-right">
                        <span class="font-bold text-emerald-600 block text-sm">₹${paid}</span>
                        ${due > 0 ? `<span class="text-[10px] text-red-500 font-medium">Due: ₹${due}</span>` : `<span class="text-[10px] text-emerald-600 font-medium">Full Paid</span>`}
                    </div>
                `;
                feeListContainer.appendChild(card);
            });
        }

        function logout() {
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('loginId').value = "";
            document.getElementById('loginMobile').value = "";
        }
    </script>
</body>
</html>
